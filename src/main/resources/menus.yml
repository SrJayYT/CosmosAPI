# Edita este archivo y ejecuta /cosmo reload para aplicar los cambios.
# Los menús /cosmo view y /cosmo tops son internos y no se configuran aquí.
# Marcadores internos: {menu}, {cosmo-name}, {cosmo-id}, {balance}, {page}, {position}, {player}.
# Los placeholders de PlaceholderAPI, como %player_name%, también funcionan en títulos, nombres y lore.

