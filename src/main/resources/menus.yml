  back:
    slot: 26
    material: GUNPOWDER
    amount: 1
    name: '&eVolver'
    lore:
      - '&7Volver a la selección de cosmos.'
  previous-page:
    slot: 21
    material: ARROW
    amount: 1
    name: '&ePágina anterior'
    lore:
      - '&7Ir a la página {page}'
  next-page:
    slot: 23
    material: ARROW
    amount: 1
    name: '&ePágina siguiente'
    lore:
      - '&7Ir a la página {page}'

# Tiendas creadas mediante /cosmo menu create. Puedes editar sus ítems manualmente.
# Ejemplo de ítem de tienda:
# menus:
#   tienda:
#     name: tienda
#     displayname: '&8Tienda'
#     # Comando público para abrir este menú. Puede escribirse con o sin /.
#     command: cosmoshoppvp
#     # true lo oculta de /cosmo view, pero su comando público seguirá funcionando.
#     hidden: false
#     type: CHEST
#     size: 27
#     items:
#       '13':
#         material: DIAMOND
#         amount: 1
#         name: '&bDiamante'
#         lore:
#           - '&7Precio: &d10 Gemas'
#         cosmo: gemas
#         price: 10
#
# Para ítems custom usa /cosmo menu edit <nombre>. Coloca el ítem y cierra el inventario.
# Después define su moneda y precio con: /cosmo menu item <menú> <slot> <cosmo> <precio>
# Tras cambiar o añadir un command, ejecuta /cosmo reload. El comando aparecerá
# en el autocompletado de todos los jugadores y abrirá el menú sin permisos.
# Los DISPENSER reservan los slots 6, 7 y 8: flecha anterior, volver y flecha siguiente.
# Los CHEST de 18+ reservan toda la última fila. Los cofres de 9 reservan volver en 0 y página en 8.
# En todos los casos, las flechas cambian de página cíclicamente y la pólvora vuelve al selector.
shop-navigation:
  previous-page:
    material: ARROW
    amount: 1
    name: '&ePágina anterior'
    lore:
      - '&7Ir a la página {page}.'
  back:
    material: GUNPOWDER
    amount: 1
    name: '&eVolver'
    lore:
      - '&7Volver al menú de cosmos.'
  next-page:
    material: ARROW
    amount: 1
    name: '&ePágina siguiente'
    lore:
      - '&7Ir a la página {page}.'
menus:
  tienda:
    name: tienda
    displayname: '&8Tienda General'
    command: tienda
    hidden: false
    type: CHEST
    size: 27
    items:
      '13':
        material: DIAMOND
        amount: 1
        name: '&bDiamante'
        lore:
          - '&7Precio: &d10 Anormal'
        cosmo: anormal
        price: 10
  tiendapvp:
    name: tiendapvp
    displayname: '&8Tienda PvP'
    command: tiendapvp
    hidden: false
    type: CHEST
    size: 27
    items:
      '13':
        material: DIAMOND_SWORD
        amount: 1
        name: '&cEspada PvP'
        lore:
          - '&7Precio: &d25 Anormal'
        cosmo: anormal
        price: 25