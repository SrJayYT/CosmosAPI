name: CosmosAPI
version: 1.0.3
main: com.devpapo.cosmosapi.CosmosAPI
api-version: '1.21'
author: devpapo
description: Sistema de monedas virtuales, recompensas y menús de tienda.
loadbefore:
  - EconomyShopGUI
softdepend:
  - PlaceholderAPI
  - TAB
  - DecentHolograms
  - PlayerKits2
commands:
  cosmo:
    description: Administra los cosmos y sus menús.
    aliases: [cosmos]
    usage: /cosmo help
  conditions:
    description: Administra condiciones que retiran cosmos.
    aliases: [condition]
    usage: /conditions help
permissions:
  cosmos.admin:
    description: Permite administrar cosmos, saldos y menús.
    default: op
  cosmos.send:
    description: Permite enviar cosmos a otros jugadores.
    default: true
  cosmos.view:
    description: Permite consultar los menús y saldos propios.
    default: true
  cosmos.conditions:
    description: Permite administrar condiciones que retiran cosmos.
    default: op