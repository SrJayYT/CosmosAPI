    amount: 1
    name: '&cNo hay menús disponibles.'
    lore: []
  previous-page:
    slot: 21
    material: ARROW
    amount: 1
    name: '&ePágina anterior'
    lore:
      - '&7Ir a la página {page}'
  next-page:
    slot: 23
    material: ARROW
    amount: 1
    name: '&ePágina siguiente'
    lore:
      - '&7Ir a la página {page}'

