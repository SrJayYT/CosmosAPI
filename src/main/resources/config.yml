memory-cleanup:
  # Minutos entre cada liberación de memoria. Usa 0 para desactivarla.
  interval-minutes: 30

anti-alt:
  # Impide recompensas PLAYER_KILL entre jugadores con la misma IP.
  same-ip-player-kill: false

menus:
  # Habilita las tiendas y comandos públicos configurados en menus.yml.
  # /cosmo view y /cosmo tops permanecen disponibles aunque esté desactivado.
  enabled: true

holograms:
  # Habilita los hologramas de ranking mediante DecentHolograms.
  enabled: true

playerkits2:
  # Cobra cosmos al reclamar kits de PlayerKits2. El precio nativo del kit debe ser 0.
  enabled: false
  kits:
    # starter:
    #   cosmo: cosmo
    #   price: 100
